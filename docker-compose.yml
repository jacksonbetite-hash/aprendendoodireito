services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aprendendo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aprendendo}
      POSTGRES_DB: aprendendoodireito
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    ports:
      # Publicado para o fluxo de desenvolvimento do README (npm run dev
      # contra o banco do compose). Em produção, remova este mapeamento.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aprendendo -d aprendendoodireito"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: aprendendoodireito:latest
    environment:
      DATABASE_URL: postgres://aprendendo:${POSTGRES_PASSWORD:-aprendendo}@db:5432/aprendendoodireito
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados-postgres:
